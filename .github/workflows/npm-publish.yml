name: Publish

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - master

permissions:
  contents: read

jobs:
  publish:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.14.0
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - id: release
        run: |
          npm view @loke/logger versions --json > "$RUNNER_TEMP/published-versions.json"
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const { version } = require("./package.json");
          const versions = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, "published-versions.json"), "utf8"));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `publish=${!versions.includes(version)}\n`);
          NODE
      - if: steps.release.outputs.publish == 'true'
        run: npm publish --access public
